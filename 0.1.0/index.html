<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <title>Варіант 12 - Реєстр ПЗ</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Реєстр програмного забезпечення (Варіант 12)</h1>
    </header>
    <main class="container">
        <section class="form-section">
            <h2>Додати ПЗ</h2>
            <form id="createForm">
                <div class="field">
                    <label for="nameInput">Name</label>
                    <input id="nameInput" type="text" />
                    <p class="error-text" id="nameError"></p>
                </div>
                <div class="field">
                    <label for="versionInput">Version</label>
                    <input id="versionInput" type="text" />
                    <p class="error-text" id="versionError"></p>
                </div>
                <div class="field">
                    <label for="licenseSelect">License Type</label>
                    <select id="licenseSelect">
                        <option value="">Оберіть ліцензію</option>
                        <option value="Free">Free</option>
                        <option value="Commercial">Commercial</option>
                    </select>
                    <p class="error-text" id="licenseError"></p>
                </div>
                <div class="field">
                    <label for="seatsInput">Seats</label>
                    <input id="seatsInput" type="number" />
                    <p class="error-text" id="seatsError"></p>
                </div>
                <div class="field">
                    <label for="commentInput">Comment</label>
                    <textarea id="commentInput" rows="3"></textarea>
                    <p class="error-text" id="commentError"></p>
                </div>
                <div class="buttons">
                    <button type="submit">Додати</button>
                    <button type="button" id="resetBtn">Очистити</button>
                </div>
            </form>
        </section>
        <section class="table-section">
            <h2>Список ПЗ</h2>
            <div class="filter-bar" style="margin-bottom:12px; display:flex; gap:12px; align-items:center;">
                <input id="searchInput" type="text" placeholder="Пошук за назвою..." style="padding:6px; width:200px;">
                <select id="licenseFilter" style="padding:6px;">
                    <option value="">Всі ліцензії</option>
                    <option value="Free">Free</option>
                    <option value="Commercial">Commercial</option>
                </select>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Назва</th>
                        <th>Версія</th>
                        <th>Ліцензія</th>
                        <th>Місця</th>
                        <th>Коментар</th>
                        <th>Дія</th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody"></tbody>
            </table>
        </section>
    </main>
</body>
</html>
